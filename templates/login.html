{% extends "base.html" %}
{% block title %}Passcode &middot; {{ member.name }}{% endblock %}
{% block content %}
<section class="gate">
  <h1>{{ member.name }}, prove it gently.</h1>
  <p class="lede">Speak the passcode and the reading room is yours.</p>
  <form method="post" class="gate-form">
    <input type="password" name="passcode" required autocomplete="current-password"
           placeholder="passcode" class="passcode-input" autofocus>
    <button type="submit" class="btn btn-giant">Enter</button>
  </form>
  <div class="ornament"><span>&#10086;</span></div>
  <p class="fineprint"><a href="{{ url_for('identity') }}">Not {{ member.name }}? Choose again.</a></p>
</section>
{% endblock %}
